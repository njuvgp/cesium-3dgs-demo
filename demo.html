<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        3DGS渲染示例
    </title>
    <script src="./lib/Cesium/Build/CesiumUnminified/Cesium.js"></script>
    <link rel="stylesheet" href="./lib/Cesium/Build/CesiumUnminified/Widgets/widgets.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="./css/style.css">
    <style>
        #slider {
            position: absolute;
            left: 99.6%;
            top: 0px;
            background-color: #d3d3d3;
            width: 5px;
            height: 100%;
            z-index: 9999;
        }
    
        #slider:hover {
            cursor: ew-resize;
        }
    
        .split-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(42, 42, 42, 0.8);
            padding: 8px;
            border-radius: 4px;
            z-index: 9999;
            font-size: large;
            font-weight: bold;
            text-align: center;
        }
    
        .split-label.left {
            left: 0;
        }
    
        .split-label.right {
            right: 0;
        }
    </style>
</head>
<body>
    <div id="CesiumContainer" class="fullSize">
        <div id="slider"></div>
        <div class="split-label left"></div>
        <div class="split-label right"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/demoscript.js"></script>
</body>
</html>
