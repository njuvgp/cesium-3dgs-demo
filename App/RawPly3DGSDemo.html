<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Raw PLY 3DGS Demo</title>
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #statusPanel {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 1;
        box-sizing: border-box;
        width: min(620px, calc(100% - 32px));
        padding: 14px 16px;
        border: 1px solid rgb(70 75 83 / 0.9);
        border-radius: 6px;
        background: rgb(20 24 31 / 0.88);
        color: #f3f6fb;
        font:
          14px/1.45 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.3);
      }

      #statusPanel h1 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 650;
      }

      #progressBar {
        width: 100%;
        height: 8px;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(77 87 102 / 0.65);
      }

      #progressFill {
        width: 0%;
        height: 100%;
        background: #68a6ff;
        transition: width 120ms ease-out;
      }

      #statusDetails {
        margin: 10px 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #c9d4e5;
      }

      #transformPanel {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 1;
        box-sizing: border-box;
        width: 320px;
        padding: 14px 16px;
        border: 1px solid rgb(70 75 83 / 0.9);
        border-radius: 6px;
        background: rgb(20 24 31 / 0.9);
        color: #f3f6fb;
        font: 13px/1.4 system-ui, sans-serif;
      }

      #transformPanel h2 { margin: 0 0 12px; font-size: 15px; }
      .controlGroup { margin: 0 0 12px; padding: 0; border: 0; }
      .controlGroup legend { margin-bottom: 6px; color: #b9c7da; font-weight: 600; }
      .inputGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .inputGrid.quaternion { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .inputGrid label { display: grid; gap: 3px; color: #aebdd0; font-size: 11px; }
      .inputGrid input {
        box-sizing: border-box; width: 100%; min-width: 0; height: 30px;
        padding: 4px 6px; border: 1px solid #526075; border-radius: 4px;
        background: #111720; color: #f3f6fb;
      }
      #resetTransform {
        width: 100%; height: 32px; border: 1px solid #61718a; border-radius: 4px;
        background: #2d3949; color: #fff; cursor: pointer;
      }
      #transformPanel input:disabled, #resetTransform:disabled { opacity: 0.5; }
      #transformError { min-height: 18px; margin-top: 8px; color: #ff9a9a; font-size: 12px; }

      @media (max-width: 1020px) {
        #statusPanel { right: 12px; left: 12px; width: auto; max-height: 38%; overflow: auto; }
        #transformPanel {
          top: auto; right: 12px; bottom: 18px; left: 12px; width: auto;
          max-height: 52%; overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <section id="statusPanel">
      <h1>Raw PLY 3DGS</h1>
      <div id="statusMessage">Loading raw PLY...</div>
      <div id="progressBar"><div id="progressFill"></div></div>
      <pre id="statusDetails"></pre>
    </section>
    <section id="transformPanel">
      <h2>3DGS 变换</h2>
      <fieldset class="controlGroup">
        <legend>平移 ENU（米）</legend>
        <div class="inputGrid">
          <label>东 E<input id="east" type="number" value="0" step="0.1" disabled /></label>
          <label>北 N<input id="north" type="number" value="0" step="0.1" disabled /></label>
          <label>上 U<input id="up" type="number" value="0" step="0.1" disabled /></label>
        </div>
      </fieldset>
      <fieldset class="controlGroup">
        <legend>旋转四元数（x, y, z, w）</legend>
        <div class="inputGrid quaternion">
          <label>X<input id="qx" type="number" value="0" step="0.01" disabled /></label>
          <label>Y<input id="qy" type="number" value="0" step="0.01" disabled /></label>
          <label>Z<input id="qz" type="number" value="0" step="0.01" disabled /></label>
          <label>W<input id="qw" type="number" value="1" step="0.01" disabled /></label>
        </div>
      </fieldset>
      <fieldset class="controlGroup">
        <legend>缩放</legend>
        <div class="inputGrid">
          <label>X<input id="sx" type="number" value="1" min="0.001" step="0.05" disabled /></label>
          <label>Y<input id="sy" type="number" value="1" min="0.001" step="0.05" disabled /></label>
          <label>Z<input id="sz" type="number" value="1" min="0.001" step="0.05" disabled /></label>
        </div>
      </fieldset>
      <button id="resetTransform" type="button" disabled>重置变换</button>
      <div id="transformError"></div>
    </section>
    <script type="module">
      import * as Cesium from "cesium";
      import "cesium/Build/Cesium/Widgets/widgets.css";

      window.CESIUM_BASE_URL = "/cesiumStatic/";
      window.Cesium = Cesium;
      await import("./RawPlyGaussianSplatLoader.js");

      const viewer = new Cesium.Viewer("cesiumContainer");
      const statusMessage = document.getElementById("statusMessage");
      const statusDetails = document.getElementById("statusDetails");
      const progressFill = document.getElementById("progressFill");
      const transformInputs = [...document.querySelectorAll("#transformPanel input")];
      const resetButton = document.getElementById("resetTransform");
      const transformError = document.getElementById("transformError");
      let gaussianPrimitive;
      let transformFrame;

      const params = new URLSearchParams(window.location.search);
      const plyUrl = params.get("url") ?? "../demo.ply";
      const longitude = Number(params.get("lon") ?? 116.391);
      const latitude = Number(params.get("lat") ?? 39.907);
      const height = Number(params.get("height") ?? 5.0);

      function onProgress(progress) {
        const percentText =
          progress.percent === undefined
            ? ""
            : ` ${Math.round(progress.percent * 100)}%`;
        statusMessage.textContent = `${progress.message}${percentText}`;
        if (progress.percent !== undefined) {
          progressFill.style.width = `${Math.round(progress.percent * 100)}%`;
        }
      }

      function value(id) { return Number(document.getElementById(id).value); }

      function applyTransform() {
        if (!gaussianPrimitive) return;
        cancelAnimationFrame(transformFrame);
        transformFrame = requestAnimationFrame(() => {
          try {
            gaussianPrimitive.setTransform({
              translationENU: new Cesium.Cartesian3(value("east"), value("north"), value("up")),
              rotation: new Cesium.Quaternion(value("qx"), value("qy"), value("qz"), value("qw")),
              scale: new Cesium.Cartesian3(value("sx"), value("sy"), value("sz")),
            });
            transformError.textContent = "";
            viewer.scene.requestRender();
          } catch (error) {
            transformError.textContent = error.message;
          }
        });
      }

      transformInputs.forEach((input) => input.addEventListener("input", applyTransform));
      resetButton.addEventListener("click", () => {
        const defaults = { east: 0, north: 0, up: 0, qx: 0, qy: 0, qz: 0, qw: 1, sx: 1, sy: 1, sz: 1 };
        Object.entries(defaults).forEach(([id, value]) => { document.getElementById(id).value = value; });
        gaussianPrimitive.resetTransform();
        transformError.textContent = "";
        viewer.scene.requestRender();
      });

      async function loadRawPly() {
        statusDetails.textContent = [
          `URL: ${plyUrl}`,
          "",
          "PLY local coordinate frame:",
          `Origin longitude: ${longitude}`,
          `Origin latitude: ${latitude}`,
          `Origin height: ${height} meters`,
          "",
          "Coordinate mapping:",
          "PLY +X = local East meters",
          "PLY +Y = local North meters",
          "PLY +Z = local Up meters",
        ].join("\n");

        const primitive = await RawPlyGaussianSplatLoader.fromUrl({
          url: plyUrl,
          longitude: longitude,
          latitude: latitude,
          height: height,
          onProgress: onProgress,
        });

        gaussianPrimitive = primitive;
        transformInputs.forEach((input) => { input.disabled = false; });
        resetButton.disabled = false;

        viewer.scene.primitives.add(primitive);
        viewer.camera.flyToBoundingSphere(
          primitive.rawPlyGaussianSplatInfo.tileset.boundingSphere,
          {
            offset: new Cesium.HeadingPitchRange(
              0.0,
              Cesium.Math.toRadians(-25.0),
              80.0,
            ),
          },
        );

        statusMessage.textContent = "Raw PLY 3DGS loaded.";
        progressFill.style.width = "100%";
        statusDetails.textContent = [
          `URL: ${primitive.rawPlyGaussianSplatInfo.url}`,
          `Splats: ${primitive.rawPlyGaussianSplatInfo.splatCount}`,
          "",
          "PLY local coordinate frame:",
          `Origin longitude: ${primitive.rawPlyGaussianSplatInfo.longitude}`,
          `Origin latitude: ${primitive.rawPlyGaussianSplatInfo.latitude}`,
          `Origin height: ${primitive.rawPlyGaussianSplatInfo.height} meters`,
          "",
          "Coordinate mapping:",
          "PLY +X = local East meters",
          "PLY +Y = local North meters",
          "PLY +Z = local Up meters",
        ].join("\n");
      }

      loadRawPly().catch((error) => {
        statusMessage.textContent = "Failed to load raw PLY 3DGS.";
        statusDetails.textContent = error.toString();
      });
    </script>
  </body>
</html>
